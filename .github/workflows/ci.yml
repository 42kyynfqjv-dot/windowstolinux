name: Rust CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: Translate authored PE32 fixture to ELF
        run: |
          python3 scripts/make_pe32_fixture.py /tmp/w2l-fixture.exe
          cargo run -- /tmp/w2l-fixture.exe /tmp/w2l-translated.rs
          rustc /tmp/w2l-translated.rs -o /tmp/w2l-translated
          set +e
          /tmp/w2l-translated > /tmp/w2l-translated.stdout 2> /tmp/w2l-translated.stderr
          result=$?
          set -e
          test "$result" -eq 12
          test ! -s /tmp/w2l-translated.stdout
          test ! -s /tmp/w2l-translated.stderr
  authored-windows-fixture:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Execute authored PE32 fixture on Windows
        shell: pwsh
        run: |
          Write-Host "Windows version: $([System.Environment]::OSVersion.VersionString)"
          python scripts/make_pe32_fixture.py fixture.exe
          $process = Start-Process -FilePath (Resolve-Path .\fixture.exe) -NoNewWindow -Wait -PassThru -RedirectStandardOutput original.stdout -RedirectStandardError original.stderr
          Write-Host "Original PE32 exit status: $($process.ExitCode)"
          if ($process.ExitCode -ne 12) { throw "Expected exit 12, got $($process.ExitCode)" }
          if ((Get-Item original.stdout).Length -ne 0) { throw "Expected empty stdout" }
          if ((Get-Item original.stderr).Length -ne 0) { throw "Expected empty stderr" }
