name: Pinned startup inventory
on:
  push:
    branches: [feature/startup-records]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s research/process/startup -v
      - run: python3 research/process/startup/check_unwind.py --self-test
      - uses: actions/download-artifact@v4
        with:
          name: rcedit-windows
          run-id: 40577863473
          github-token: ${{ github.token }}
          path: original
      - run: python3 research/process/startup/inventory.py original
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --locked --example stream_graph
      - run: python3 research/process/startup/observe_boundary.py original target/debug/examples/stream_graph
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: startup-inventory
          path: |
            original/startup-inventory.json
            original/execution-boundary.json
  original-user-mode-probes:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Check bounded owned-process diagnostics
        run: python -m unittest discover -s corpus -p test_windows_wait_observer.py -v
      - uses: actions/download-artifact@v4
        with:
          name: rcedit-windows
          run-id: 40577863473
          github-token: ${{ github.token }}
          path: original
      - name: Observe original entry thread state
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $install = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $vcvars = Join-Path $install 'VC\Auxiliary\Build\vcvarsall.bat'
          cmd /c "`"$vcvars`" x86 -vcvars_ver=14.44 && python research/process/startup/measure_entry.py original %RUNNER_TEMP%/entry-observation"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: startup-entry-observation
          path: ${{ runner.temp }}/entry-observation
      - name: Measure frozen original exception and cleanup outcomes
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $install = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $vcvars = Join-Path $install 'VC\Auxiliary\Build\vcvarsall.bat'
          cmd /c "`"$vcvars`" x86 -vcvars_ver=14.44 && python research/process/startup/measure_probe.py %RUNNER_TEMP%/startup-probes"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Measure frozen context restoration and nonlocal transfer
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $install = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $vcvars = Join-Path $install 'VC\Auxiliary\Build\vcvarsall.bat'
          cmd /c "`"$vcvars`" x86 -vcvars_ver=14.44 && python research/process/startup/measure_context.py %RUNNER_TEMP%/context-probes"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: startup-original-probes
          path: ${{ runner.temp }}/startup-probes
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: startup-context-probes
          path: ${{ runner.temp }}/context-probes
      - name: Observe independent root-boundary behavior without a debugger
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $install = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $vcvars = Join-Path $install 'VC\Auxiliary\Build\vcvarsall.bat'
          cmd /c "`"$vcvars`" x86 -vcvars_ver=14.44 && python research/process/startup/measure_root.py %RUNNER_TEMP%/root-probes"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: startup-root-probes
          path: ${{ runner.temp }}/root-probes
      - name: Measure frozen original context handler slice
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $install = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $vcvars = Join-Path $install 'VC\Auxiliary\Build\vcvarsall.bat'
          cmd /c "`"$vcvars`" x86 -vcvars_ver=14.44 && python research/process/startup/measure_slice.py %RUNNER_TEMP%/handler-slice"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: startup-handler-slice
          path: ${{ runner.temp }}/handler-slice
      - name: Measure frozen v2 event and resumed continuation
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $install = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $vcvars = Join-Path $install 'VC\Auxiliary\Build\vcvarsall.bat'
          cmd /c "`"$vcvars`" x86 -vcvars_ver=14.44 && python research/process/startup/measure_event.py %RUNNER_TEMP%/handler-event"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: startup-handler-event
          path: ${{ runner.temp }}/handler-event
      - name: Measure frozen original nested cleanup and manual restore
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $install = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $vcvars = Join-Path $install 'VC\Auxiliary\Build\vcvarsall.bat'
          cmd /c "`"$vcvars`" x86 -vcvars_ver=14.44 && python research/process/startup/measure_unwind.py %RUNNER_TEMP%/unwind-slice"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --locked --example frame_unwind
      - name: Check original frame fragments on Windows
        shell: pwsh
        run: |
          python research/process/startup/check_frame.py "$env:RUNNER_TEMP/unwind-slice" target/debug/examples/frame_unwind.exe --output "$env:RUNNER_TEMP/unwind-slice/frame-native-windows"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: startup-unwind-slice
          path: ${{ runner.temp }}/unwind-slice
  native-handler-slice:
    needs: original-user-mode-probes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked --example handler_slice
      - run: cargo build --locked --example handler_slice
      - uses: actions/download-artifact@v4
        with:
          name: startup-handler-slice
          path: original-handler
      - run: python3 research/process/startup/check_slice.py original-handler target/debug/examples/handler_slice
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: startup-handler-native
          path: original-handler

  native-handler-event:
    needs: original-user-mode-probes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked --example handler_event
      - run: cargo build --locked --example handler_event
      - uses: actions/download-artifact@v4
        with:
          name: startup-handler-event
          path: original-event
      - run: python3 research/process/startup/check_event.py original-event target/debug/examples/handler_event
      - run: python3 research/process/startup/check_event_variants.py target/debug/examples/handler_event --output original-event/independent-vectors
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: startup-handler-event-native
          path: original-event

  native-unwind-slice:
    needs: original-user-mode-probes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked --example unwind_slice
      - run: cargo build --locked --example unwind_slice
      - run: cargo build --locked --example frame_unwind
      - uses: actions/download-artifact@v4
        with:
          name: startup-unwind-slice
          path: original-unwind
      - run: python3 research/process/startup/check_unwind.py original-unwind target/debug/examples/unwind_slice
      - run: python3 research/process/startup/coff_binding.py --test-artifact original-unwind
      - run: python3 research/process/startup/frame_binding.py --test-artifact original-unwind
      - run: python3 research/process/startup/check_frame.py original-unwind target/debug/examples/frame_unwind --output original-unwind/frame-native-linux
      - run: python3 research/process/startup/check_unwind_variants.py target/debug/examples/unwind_slice --output original-unwind/independent-vectors
      - run: python3 research/process/startup/check_dispatch_variants.py target/debug/examples/unwind_slice --output original-unwind/dispatch-vectors
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: startup-unwind-native
          path: original-unwind
